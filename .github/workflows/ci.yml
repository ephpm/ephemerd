name: CI

on:
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.1"

jobs:
  ci:
    name: Lint, Unit, E2E & Build (Linux)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6

      # Go and mage come from the runner-ci-linux image (see images/runner-ci-linux/Dockerfile),
      # so setup-go and `go install mage` are unnecessary here.
      # - uses: actions/setup-go@v6
      #   with:
      #     go-version: ${{ env.GO_VERSION }}
      # - name: Install mage
      #   run: go install github.com/magefile/mage@latest

      - name: Restore cached build deps
        run: /opt/ephemerd-ci/entrypoint-cache.sh
        continue-on-error: true

      - name: Lint, test & build
        run: mage ci

      # `mage test` runs `go test ./...`, which buffers each package's output
      # and prints it only on failure — so a test that skips part of itself on
      # a green run says so to nobody. This step exists purely to put that on
      # the record: it re-runs the dind pull regression test verbosely and
      # prints either a PASS for both its tiers or the SKIP reason for the one
      # that needs mount(2), which this unprivileged runner cannot do. See the
      # "Privilege requirements" section on the test.
      - name: Privileged-test coverage report (dind pull e2e)
        run: |
          go test -tags containers_image_openpgp -count=1 \
            -run TestImagePull_SharedNamespaceHitIsUsableFromJobNamespace \
            -v ./pkg/dind/

      # Same rationale as the step above, for the #125 bind-staging tests. The
      # security property they cover — that a job cannot swap a bind source
      # between validation and runc's mount — is only observable when mount(2)
      # is available, which it is not on this unprivileged runner. Printing
      # the SKIP keeps that on the record instead of letting a green package
      # imply coverage it does not have; the previous attempt at #125 passed
      # review on exactly that misreading.
      #
      # TestBindTranslation_RealContainerd is in the list because it USED to
      # run here and no longer does: bind translation now stages every
      # job-supplied source as a real bind mount, so the test needs mount(2)
      # where it previously did not. That is a genuine loss of CI coverage and
      # it should be legible as a SKIP line, not inferred from a green package.
      # It is not fixable by making staging degrade when unprivileged — that
      # reinstates the escape and turns every one of these tests green while
      # the vulnerability is live.
      #
      # Keep the -run pattern in sync with the test names; see requireBindStaging.
      - name: Privileged-test coverage report (dind bind staging, #125)
        run: |
          go test -tags containers_image_openpgp -count=1 \
            -run 'TestBindStaging|TestBindTranslation|TestSweepStagedBinds|TestEnsureTrustedAncestry|TestUnmountTreeAndRemove|TestResolveBeneathWalk' \
            -v ./pkg/dind/

      - name: E2E — GitHub provider (fake server)
        run: mage e2egithub

      - name: E2E — Go module proxy
        run: mage e2emodproxy

  build-macos:
    name: Build (macOS arm64)
    needs: ci
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Build macOS binary
        run: mage build:macos

      - name: Verify binary
        run: |
          ./ephemerd --version
          codesign -v ./ephemerd && echo "codesigned" || echo "not codesigned"

  build-linux-arm64:
    name: Build (Linux arm64)
    needs: ci
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Build Linux arm64 binary
        run: mage build:build

      - name: Verify binary
        run: ./ephemerd --version

  build-windows:
    name: Build (Windows amd64)
    needs: ci
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v6

      - name: Restore cached build deps
        run: C:\ephemerd-ci\entrypoint-cache.ps1
        continue-on-error: true

      - name: Ensure mage is available
        run: |
          if (Get-Command mage -ErrorAction SilentlyContinue) { return }
          Write-Host "mage not found - installing via go install..."
          $env:GOBIN = 'C:\go\bin'
          go install github.com/magefile/mage@latest

      - name: Build Windows binary
        run: mage build:build

      - name: Verify binary
        run: .\ephemerd.exe --version

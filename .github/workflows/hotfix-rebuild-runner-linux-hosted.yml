# TEMPORARY hotfix workflow — rebuild the linux/amd64 runner image on a
# GitHub-HOSTED runner so it picks up the current actions-runner base
# (2.338.x) while the self-hosted linux/x64 pool is down (stale baked runner
# below GitHub's dispatch floor = fleet-wide stall). Pushes an amd64-only
# dated tag; ducks (amd64) is then pointed at it via `mayfly node reconfigure`.
# Delete this file once the normal self-hosted build pipeline is healthy.
name: Hotfix Rebuild Runner Linux (hosted)

on:
  workflow_dispatch:
  # Also run on push to this hotfix branch so it can execute without the
  # workflow first existing on the default branch (workflow_dispatch requires
  # the file on the default branch; a push trigger runs from the branch).
  push:
    branches: [fix/runner-2338-and-apk-mirror]
    paths:
      - ".github/workflows/hotfix-rebuild-runner-linux-hosted.yml"

env:
  IMAGE_REPO: ephpm/ephemerd

jobs:
  build:
    name: Build & push runner-ci-linux amd64 (hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set date tag
        run: echo "DATE_TAG=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Real Docker/BuildKit on the hosted runner (TARGETARCH is populated by
      # BuildKit for the host platform = amd64). The Dockerfile's base
      # `FROM ghcr.io/actions/actions-runner:latest` therefore pulls the
      # current amd64 runner, baking a current /home/runner.
      - name: Build & push
        run: |
          TAG="${{ env.IMAGE_REPO }}:runner-ci-linux-amd64-${{ env.DATE_TAG }}-hotfix"
          docker build -t "$TAG" images/runner-ci-linux
          docker push "$TAG"
          echo "PUSHED=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "pushed $TAG"

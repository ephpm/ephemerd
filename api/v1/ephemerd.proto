syntax = "proto3";

package ephemerd.v1;

option go_package = "github.com/ephpm/ephemerd/api/v1;apiv1";

service Control {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc KillJob(KillJobRequest) returns (KillJobResponse);
  rpc GetJobLogs(GetJobLogsRequest) returns (stream LogChunk);
  // Cordon stops the daemon from claiming new jobs without initiating
  // shutdown; running jobs continue. Uncordon resumes claiming. Used by
  // `ephemerd drain --wait` to empty the daemon before a restart.
  rpc Cordon(CordonRequest) returns (CordonResponse);
  rpc Uncordon(UncordonRequest) returns (UncordonResponse);
  // Upgrade replaces the running daemon's own binary with a specific
  // published release, then restarts the service into it. The daemon
  // downloads and checksum-verifies the release asset over its own
  // outbound HTTPS (provider-agnostic, no exec/size limit), drains
  // running jobs first, swaps the binary, and restarts. Progress is
  // streamed so the caller can watch state transitions; the final
  // message is UPGRADE_STATE_RESTARTING, sent BEFORE the service
  // restarts, after which the caller polls Status until the reported
  // version matches the target. See docs/arch/upgrade-command.md.
  rpc Upgrade(UpgradeRequest) returns (stream UpgradeProgress);
}

message StatusRequest {}

message StatusResponse {
  string status = 1;
  int32 active_jobs = 2;
  int32 max_concurrent = 3;
  bool draining = 4;
  string uptime = 5;
  // version is the running daemon's build version (the value stamped into
  // `ephemerd --version`). Empty on daemons built before this field existed.
  // The upgrade flow polls this after a restart to confirm the new binary
  // came up on the target version.
  string version = 6;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message GetJobRequest {
  int64 id = 1;
}

message Job {
  int64 id = 1;
  string name = 2;
  string repo = 3;
  string image = 4;
  int64 runner_id = 5;
  string status = 6;
  uint32 pid = 7;
  string started_at = 8; // RFC3339
  string uptime = 9;
}

message KillJobRequest {
  int64 id = 1;
}

message KillJobResponse {}

message CordonRequest {}

message CordonResponse {
  int32 active_jobs = 1; // jobs still running at the time of the cordon
}

message UncordonRequest {}

message UncordonResponse {
  int32 active_jobs = 1;
}

message GetJobLogsRequest {
  int64 id = 1;
  bool follow = 2;
}

message LogChunk {
  bytes data = 1;
}

message UpgradeRequest {
  // target_version is REQUIRED, e.g. "v0.1.7". The daemon never resolves
  // "latest" on its own: on a CI fleet an implicit latest would let one bad
  // release take down every node at once. Must be an explicit release tag.
  string target_version = 1;
  // url_override optionally replaces the release base URL
  // (https://github.com/ephpm/ephemerd/releases/download/<tag>). When set,
  // the archive is fetched from <url_override>/<asset> and the checksums from
  // <url_override>/checksums.txt. For testing and air-gapped mirrors.
  string url_override = 2;
  // drain_timeout_seconds bounds the wait for running jobs to finish before
  // the swap. 0 -> server default. On timeout the upgrade aborts and the node
  // keeps running the OLD binary (it is left uncordoned).
  int32 drain_timeout_seconds = 3;
  // no_drain skips the cordon/drain step (operator override for an emergency
  // upgrade). Running jobs are interrupted by the restart.
  bool no_drain = 4;
  // force re-installs the target even if the daemon already reports it.
  bool force = 5;
}

enum UpgradeState {
  UPGRADE_STATE_UNSPECIFIED = 0;
  UPGRADE_STATE_PREFLIGHT = 1;   // validating request, resolving install path
  UPGRADE_STATE_UP_TO_DATE = 2;  // already on target; no-op success, stream ends
  UPGRADE_STATE_DRAINING = 3;    // cordoned, waiting for running jobs to finish
  UPGRADE_STATE_DOWNLOADING = 4; // fetching the release archive
  UPGRADE_STATE_VERIFYING = 5;   // checksum-verifying the downloaded archive
  UPGRADE_STATE_STAGING = 6;     // extracting + probing the new binary
  UPGRADE_STATE_SWAPPING = 7;    // replacing the on-disk binary (old kept as .old)
  UPGRADE_STATE_RESTARTING = 8;  // new binary in place; service restart scheduled
  UPGRADE_STATE_FAILED = 9;      // aborted; node still on the old binary
}

message UpgradeProgress {
  UpgradeState state = 1;
  string message = 2;
  string current_version = 3;
  string target_version = 4;
  int32 active_jobs = 5;        // populated during DRAINING
  int64 bytes_downloaded = 6;   // populated during DOWNLOADING
  int64 bytes_total = 7;        // total asset size if known (else 0)
}

// Dispatch is a lightweight job dispatch service used by the in-VM
// containerd-only worker (Hyper-V Linux VM on Windows, Vz Linux VM on macOS).
// The host scheduler sends Linux jobs here via gRPC; the worker creates
// containers using its local (Linux) Runtime. The host also subscribes to
// StreamContainerStats to surface per-container resource usage on its own
// /metrics endpoint without exposing a second listener inside the VM.
service Dispatch {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc WaitJob(WaitJobRequest) returns (WaitJobResponse);
  rpc DestroyJob(DestroyJobRequest) returns (DestroyJobResponse);
  rpc StreamContainerStats(StreamContainerStatsRequest) returns (stream ContainerStatsBatch);
}

message CreateJobRequest {
  string id = 1;
  string image = 2;
  string jit_config = 3;
  // provider is the forge name (e.g. "github", "gitea"); together with
  // repo it scopes dind's per-repo image cache.
  string provider = 4;
  // repo is the forge-native repo path (e.g. "owner/repo").
  string repo = 5;
}
message CreateJobResponse {}

message WaitJobRequest { string id = 1; }
message WaitJobResponse { uint32 exit_code = 1; }

message DestroyJobRequest { string id = 1; }
message DestroyJobResponse {}

// StreamContainerStatsRequest opens a long-lived sampling stream. The host
// dictates the cadence; the in-VM worker ticks at this interval and sends one
// ContainerStatsBatch per tick.
message StreamContainerStatsRequest {
  uint32 interval_seconds = 1; // 0 -> server default (10s)
}

message ContainerStatsBatch {
  int64 timestamp_unix_nano = 1; // server-side wall clock at sample time
  repeated ContainerStats stats = 2;
}

message ContainerStats {
  string id = 1;
  string repo = 2;
  uint64 cpu_usage_nanos = 3;       // cumulative CPU time in nanoseconds
  uint64 memory_bytes = 4;          // current usage
  uint64 memory_anon_bytes = 5;     // anon-only (cgroup); 0 on Windows
  uint64 cpu_limit = 6;             // configured vCPU count; 0 = unlimited
  uint64 memory_limit_bytes = 7;    // configured memory cap; 0 = unlimited
  // Cumulative network bytes (the runner container only — does not include
  // sibling containers spawned via dind). On Linux this is read via
  // netlink against the container's netns and excludes loopback. On
  // Windows it sums BytesReceived/BytesSent across HCS endpoints.
  uint64 network_rx_bytes = 8;
  uint64 network_tx_bytes = 9;
}

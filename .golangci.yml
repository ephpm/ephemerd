version: "2"

run:
  build-tags:
    - containers_image_openpgp

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - bodyclose
    - nilerr

  disable:
    - depguard
    - wrapcheck
    - exhaustruct

  exclusions:
    rules:
      - path: "localtunnel"
        linters:
          - errorlint
          - bodyclose
      # The cargo proxy tests route every request through a get() helper that
      # reads the body and closes it in a defer. bodyclose tracks the
      # *http.Response the helper returns, not what the helper does with it,
      # so it flags all 30-odd call sites. Same reasoning as localtunnel above.
      - path: "pkg/proxies/cargo/.*_test\\.go"
        linters:
          - bodyclose
      - path: "api/v1"
        linters:
          - errorlint
      - path: "mage/"
        linters:
          - errorlint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
